[package]
name = "nest-lsp"
description = "The language server for Nest."
authors = ["Oliwier Michalik"]
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

[dependencies]
crossbeam-channel = "0.5.15"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
nestc = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.4"
