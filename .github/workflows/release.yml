name: Release

# Builds the toolchain on every platform CI covers and attaches an archive per
# platform to the release that triggered it. The archive is the layout an
# installed `nestc` looks in (`nestc/src/common/install.rs`):
#
#   nest-<tag>-<target>/
#     bin/nestc  bin/nest-lsp  bin/twig
#     lib/nest/libnest_runtime.a  lib/nest/libgc.a
#     lib/nest/packages/core/  lib/nest/packages/std/

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the archives to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (x86_64)
            os: ubuntu-24.04
            target: x86_64-linux
          - name: macos (arm64)
            os: macos-14
            target: aarch64-macos

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install LLVM 21 and bdw-gc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev libgc-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "BDW_GC_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Install LLVM 21 and bdw-gc (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@21 bdw-gc

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Build
        run: just build

      - name: Package
        run: |
          set -euxo pipefail
          name="nest-${TAG}-${{ matrix.target }}"
          dist="dist/$name"
          mkdir -p "$dist/bin" "$dist/lib/nest/packages"
          cp nestc/target/release/nestc nestc/target/release/nest-lsp twig/build/release/twig "$dist/bin/"
          # The runtime archive `build.rs` wrote; the newest, should a cache
          # ever leave an older build directory beside it.
          runtime="$(ls -t $(find nestc/target/release/build -name libnest_runtime.a) | head -1)"
          cp "$runtime" "$dist/lib/nest/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            gc="$(brew --prefix bdw-gc)/lib/libgc.a"
          else
            gc="/usr/lib/$(cc -print-multiarch)/libgc.a"
          fi
          cp "$gc" "$dist/lib/nest/"
          cp -R packages/core packages/std "$dist/lib/nest/packages/"
          rm -rf "$dist/lib/nest/packages/"*/build
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          echo "DIST=$dist" >> "$GITHUB_ENV"

      - name: Check the packaged compiler builds a program on its own
        run: |
          set -euxo pipefail
          printf '{ println } :: import <std/io>\nmain :: func () { println("ok") }\n' > hello.nest
          env -u NEST_CORE -u NEST_STD "$DIST/bin/nestc" hello.nest -o hello
          test "$(./hello)" = ok

      - name: Archive
        run: |
          set -euxo pipefail
          tar -czf "$ARCHIVE" -C dist "$(basename "$DIST")"
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
