name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (x86_64)
            os: ubuntu-24.04
          - name: macos (arm64)
            os: macos-14
          - name: windows (x86_64)
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 and bdw-gc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev libgc-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "BDW_GC_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Install LLVM 21 and bdw-gc (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@21 bdw-gc

      - name: Install LLVM 21 and bdw-gc (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=21.0.0 --allow-downgrade -y
          vcpkg install bdwgc:x64-windows
          echo "LLVM_SYS_211_PREFIX=C:\Program Files\LLVM" >> $env:GITHUB_ENV
          echo "BDW_GC_PREFIX=C:\vcpkg\packages\bdwgc_x64-windows" >> $env:GITHUB_ENV

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nestc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the tree-sitter CLI
        working-directory: editors/tree-sitter-nest
        run: npm ci

      - name: Check the tools are found
        run: just tools

      - name: Check formatting
        run: just fmt-check

      - name: Build
        run: just profile=debug build

      - name: Test
        run: just profile=debug test
