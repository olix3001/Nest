# Every suite there is, on both the platforms this toolchain is developed on.
#
# The job mirrors `just` rather than reimplementing it: the recipes already know
# how to find LLVM and the collector, in what order the three tools are built,
# and which suites exist. What is left here is installing what a fresh machine
# does not have — which is exactly what `just tools` checks for — and saying so
# once per platform.
#
# The **debug** profile throughout. A release `cargo test` is several times
# slower for the same answers, and the only thing it tests that debug does not
# is the optimizer; a change aimed at that is the one case for running the
# suites again with `profile=release`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something panics, and a panic in CI is the
  # one place nobody can re-run it by hand.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing is a fact about that platform; the other's answer
      # is still worth having.
      fail-fast: false
      matrix:
        include:
          - name: linux (x86_64)
            os: ubuntu-24.04
          - name: macos (arm64)
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      # LLVM 21 and the Boehm collector: the two things `nestc/build.rs` looks
      # for and neither runner has. The justfile finds both the same way it does
      # locally — `brew --prefix` on macOS, the well-known path on Linux — so
      # nothing here needs to be passed through to it.
      - name: Install LLVM 21 and bdw-gc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev libgc-dev
          # `llvm-sys` reads this; on Linux the justfile's `llvm-config` probe
          # would find it too, but naming it is cheaper than a search.
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "BDW_GC_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Install LLVM 21 and bdw-gc (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@21 bdw-gc

      - name: Install just
        uses: extractions/setup-just@v2

      # The toolchain file pins nightly; this installs exactly that one and
      # nothing else, and brings `rustfmt` for the formatting check below.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      # Keyed on the lockfile and the compiler version, so a dependency bump or
      # a nightly bump gets a fresh cache and everything else reuses one.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nestc

      # For `test-grammar`, which skips itself when there is no `npx`. Skipping
      # is right on a developer's machine and wrong here: a grammar change that
      # breaks the corpus should not reach `main`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tree-sitter CLI
        working-directory: editors/tree-sitter-nest
        run: npm ci

      - name: Check the tools are found
        run: just tools

      - name: Check formatting
        run: just fmt-check

      # Everything, in dependency order: nestc, then nest-lsp, then twig built
      # by the twig before it. `just test` runs `std`'s and twig's suites with
      # the binary this produces, and **silently skips them** when there is
      # none — so building first is what makes those two suites run at all.
      - name: Build
        run: just profile=debug build

      - name: Test
        run: just profile=debug test
